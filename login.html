<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportMap - Login</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Archivo+Black&family=Permanent+Marker&display=swap%22 rel="
    stylesheet">
</head>

<body>
  <div class="glow"></div>

  <div class="container-fluid page-row">
    <div class="row min-vh-100 align-items-center">

      <!-- Conteúdo hero -->
      <div class="col-lg-6 col-xl-5 d-none d-lg-block  ps-5  ">
        <div class="hero-content">
          <h1 class="headline mt-3 mb-3">Faça login<br><span class="accent">na sua conta</span><br>e encontre<br><span
            class="accent">a galera.</span>
          </h1>
        </div>
      </div>


      <!-- Formulário -->
      <div class="col-lg-6 col-xl-5 offset-xl-1 d-flex align-items-center justify-content-center py-5">
        <div class="form-wrap px-3 px-sm-4">

          <!-- Sport Map logo-->
          <div class="d-flex align-items-center mb-4">
            <div
              style="font-family:'Permanent Marker',cursive; font-size: 2.1rem; line-height:1; display:inline-block; transform:rotate(-2deg);">
              <span style="color:#ff5a1f; -webkit-text-stroke:3px #050505; paint-order: stroke fill;">Sport</span><span
                style="color:#ffffff; -webkit-text-stroke:3px #050505; paint-order: stroke fill;">Map</span>
            </div>
          </div>

          <div class="d-flex align-items-center gap-2 mb-2">
            <span class="step-dot active"></span>
            <span class="step-dot"></span>
            <span class="step-dot"></span>
          </div>

          <h2 class="fw-bold mb-1">Login</h2>

          <form novalidate>

            <div class="mb-3">
              <label for="email">E-mail:</label>
              <input type="email" class="form-control" id="email" placeholder="voce@email.com">
            </div>

            <div class="mb-3">
              <label for="senha">Senha:</label>
              <div class="input-group">
                <input type="password" class="form-control" id="senha" placeholder="Mínimo 8 caracteres">
                <span class="input-group-text"><i class="bi bi-eye"></i></span>
              </div>
            </div>

            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="termos"
                style="background-color: var(--sm-panel-2); border-color: var(--sm-border);">
              <label class="form-check-label text-secondary" for="termos" style="font-size:.82rem; font-weight:400;">
                Aceito os <a href="#" class="link-orange">termos de uso</a> e a <a href="#" class="link-orange">política
                de privacidade</a>
              </label>
            </div>

            <button type="submit" class="btn btn-orange w-100">Entrar na conta</button>

            <div class="divider">ou continue com</div>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-social flex-fill"><i class="bi bi-google me-2"></i>Google</button>
            </div>

            <label class=" divider form-check-label text-secondary text-center w-100"
              style="font-size:.82rem; font-weight:400;">
              <a href="#" class="link-orange">Criar conta</a>
            </label>

          </form>
        </div>
      </div>
    </div>
  </div>


  <link rel="stylesheet" href="login.css">

</body>

</html>
