<div class="criar-publicacao">

    <h2>Criar publicação</h2>

    <!-- PASSO 1 -->
    <div class="passo-publicacao">
        <div class="numero-passo">1</div>

        <div class="conteudo-passo">
            <h3>O que você quer compartilhar?</h3>

            <textarea
                id="textoPublicacao"
                placeholder="Compartilhe seu treino, lugar ou momento esportivo..."
            ></textarea>
        </div>
    </div>

    <!-- PASSO 2 -->
    <div class="passo-publicacao">
        <div class="numero-passo">2</div>

        <div class="conteudo-passo">
            <h3>Adicione uma imagem</h3>

            <label class="adicionar-imagem">
                <i class="bi bi-image"></i>
                <span>Adicionar imagem</span>

                <input
                    type="file"
                    id="imagemPublicacao"
                    accept="image/*"
                >
            </label>
        </div>
    </div>

    <!-- PASSO 3 -->
    <div class="passo-publicacao">
        <div class="numero-passo">3</div>

        <div class="conteudo-passo">
            <h3>Adicione uma localização</h3>

            <input
                type="text"
                id="localPublicacao"
                placeholder="Digite o local..."
            >
        </div>
    </div>

    <!-- BOTÃO -->
    <button type="button" class="btn-publicar">
        Publicar
    </button>

</div>
